name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: nordicbyte
          POSTGRES_PASSWORD: nordicbyte_test
          POSTGRES_DB: nordicbyte_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U nordicbyte -d nordicbyte_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: nordicbyte
      DB_PASSWORD: nordicbyte_test
      DB_NAME: nordicbyte_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Initialize database
        run: |
          PGPASSWORD=nordicbyte_test psql \
            -h localhost \
            -U nordicbyte \
            -d nordicbyte_test \
            -f database/init.sql

      - name: Run tests
        working-directory: app
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f app/Dockerfile -t nordicbyte-api:${{ github.sha }} app

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: docker tag nordicbyte-api:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/nordicbyte-api:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/nordicbyte-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/nordicbyte-api:${{ github.sha }}
      DB_USER: nordicbyte
      DB_PASSWORD: nordicbyte_deploy
      DB_NAME: nordicbyte

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull deployment image
        run: docker pull $API_IMAGE

      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config

      - name: Start deployment
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Wait for API
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost/health; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f docker-compose.prod.yml logs
          exit 1

      - name: Show deployment status
        run: docker compose -f docker-compose.prod.yml ps

      - name: Stop deployment
        if: always()
        run: docker compose -f docker-compose.prod.yml down
